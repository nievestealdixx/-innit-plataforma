<style>
  :root{
    --ink:#1B1A17; --ink-soft:#6A6459; --paper:#F7F3E8; --card:#FFFFFF; --line:#E7E1D2;
    --yellow:#F5C70F; --orange:#D96A32; --red:#CC3333; --cyan:#18AACD; --green:#189B83; --olive:#CABB17;
    --green-bg:#E1F1ED; --red-bg:#F8E3E3; --yellow-bg:#FDF3CE; --cyan-bg:#E4F0F5;
    --shadow:0 1px 2px rgba(27,26,23,.04), 0 10px 30px rgba(27,26,23,.07);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Inter",system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); font-weight:600}
  .brandmark{font-family:"Bricolage Grotesque"; font-weight:800; font-size:22px; letter-spacing:-.02em; color:var(--yellow); display:flex; align-items:center; gap:2px}
  .brandmark .ec{font-size:10px; letter-spacing:.18em; color:#fff; opacity:.6; text-transform:uppercase; font-family:"Inter"; font-weight:600; margin-left:6px}
  .iso{height:30px; width:30px; margin-right:9px}
  .login-logo{display:block; margin:0 auto 8px; height:88px; width:88px}
  .home-logo{height:46px; display:block; position:relative; z-index:1}
  .flor{position:absolute; right:-22px; bottom:-40px; width:180px; opacity:.13; z-index:0; pointer-events:none}
  .hl{background:linear-gradient(transparent 58%, var(--yellow) 58%); padding:0 .06em}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:600; font-size:14px}
  .btn-primary{background:var(--yellow); color:var(--ink); padding:11px 18px} .btn-primary:hover{filter:brightness(.96)}
  .btn-ghost{background:transparent; color:var(--ink); padding:10px 15px; border:1px solid var(--line)} .btn-ghost:hover{border-color:var(--ink)}
  .btn-sm{padding:7px 12px; font-size:13px}
  input, select{font-family:inherit; font-size:15px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; width:100%; background:#fff; color:var(--ink)}
  textarea{font-family:inherit; font-size:15px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; width:100%; background:#fff; color:var(--ink); resize:vertical; min-height:74px}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--yellow); outline-offset:1px; border-color:transparent}
  label.lab{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600}

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
  .login-card{background:var(--card); border-radius:20px; box-shadow:var(--shadow); width:100%; max-width:400px; overflow:hidden}
  .login-band{height:10px; background:var(--yellow)}
  .login-body{padding:30px 28px}
  .login-body .brandmark{color:var(--ink)} .login-body .brandmark .ec{color:var(--ink-soft); opacity:1}
  .login-body h1{font-family:"Bricolage Grotesque"; font-weight:700; font-size:24px; margin:16px 0 4px}
  .login-body p.hint{font-size:13px; color:var(--ink-soft); margin:0 0 20px}
  .field{margin-bottom:12px}
  .login-actions{display:flex; gap:10px; margin-top:6px} .login-actions button{flex:1}
  .msg{margin-top:14px; font-size:13px; padding:10px 12px; border-radius:8px; display:none}
  .msg.err{display:block; background:var(--red-bg); color:var(--red)}
  .msg.ok{display:block; background:var(--green-bg); color:var(--green)}
  .msg.info{display:block; background:var(--yellow-bg); color:var(--orange)}

  .topnav{background:var(--ink); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .who{display:flex; align-items:center; gap:10px; font-size:13px; color:#CFC9BC}
  .rol-pill{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:20px; background:#333029; color:#fff; font-weight:600}
  .rol-pill.prof{background:var(--yellow); color:var(--ink)} .rol-pill.rrhh{background:var(--cyan); color:#fff}
  .btn-out{background:transparent; color:#CFC9BC; border:1px solid #3A362E; padding:7px 12px}
  .wrap{max-width:940px; margin:0 auto; padding:20px 20px 70px}

  .tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap}
  .tab{background:transparent; color:var(--ink-soft); border:1px solid var(--line); padding:9px 16px; border-radius:20px}
  .tab.active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .selector{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap}
  .selector select{min-width:240px; font-size:15px; padding:10px 12px}

  /* HOME */
  .home-hero{background:var(--ink); border-radius:20px; padding:34px 30px; margin-bottom:18px; box-shadow:var(--shadow); position:relative; overflow:hidden}
  .home-hero .brandmark{font-size:40px}
  .home-hero .tagline{color:#CFC9BC; font-size:14px; margin-top:8px}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px}
  .stat{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px}
  .stat .n{font-family:"Bricolage Grotesque"; font-weight:700; font-size:34px; line-height:1}
  .stat .l{font-size:12.5px; color:var(--ink-soft); margin-top:5px}

  .hero{background:var(--card); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:18px}
  .hero-band{height:10px; background:var(--yellow)}
  .hero-body{padding:24px 26px}
  .hero-top{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px}
  .name{font-family:"Bricolage Grotesque"; font-weight:700; font-size:34px; line-height:1.05; letter-spacing:-.02em; margin:8px 0 0; display:inline-block}
  .level-badge{display:inline-flex; align-items:center; background:var(--ink); color:#fff; border-radius:10px; padding:8px 13px; font-weight:600; font-size:13px}
  .baja-badge{display:inline-flex; align-items:center; background:var(--red-bg); color:var(--red); border-radius:10px; padding:8px 13px; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.05em}
  .meta{display:flex; flex-wrap:wrap; gap:14px 0; margin-top:16px; border-top:1px solid var(--line); padding-top:16px}
  .meta div{padding-right:22px; margin-right:22px; border-right:1px solid var(--line)}
  .meta div:last-child{border-right:none; margin-right:0; padding-right:0}
  .meta .k{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px; font-weight:600}
  .meta .v{font-weight:600; font-size:15px}

  .tile{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px; margin-bottom:18px}
  .tile .big{font-family:"Bricolage Grotesque"; font-weight:700; font-size:34px; letter-spacing:-.02em; line-height:1}
  .tile .big small{font-size:15px; color:var(--ink-soft); font-weight:600}
  .tile .lab{margin-top:6px; font-size:12.5px; color:var(--ink-soft)}

  .bars{display:flex; align-items:flex-end; gap:8px; height:150px; margin-top:16px; padding-top:10px}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0}
  .bar-fill{width:100%; max-width:44px; background:var(--green); border-radius:5px 5px 2px 2px; min-height:3px}
  .bar-fill.low{background:var(--orange)} .bar-fill.abs{background:var(--red)}
  .bar-val{font-size:10px; color:var(--ink); margin-bottom:4px; font-weight:600}
  .bar-lab{font-size:10px; color:var(--ink-soft); margin-top:6px; text-align:center; white-space:nowrap}

  .section{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:22px 24px; margin-bottom:18px}
  .section h2{font-family:"Bricolage Grotesque"; font-weight:700; font-size:19px; margin:0 0 4px}
  .section .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-size:13.5px; background:var(--yellow-bg); border-radius:8px; padding:7px 12px; color:var(--ink)}
  .cause-chip{font-size:13px; background:var(--red-bg); color:var(--red); border-radius:8px; padding:6px 11px; font-weight:600}

  .obs{padding:12px 0; border-bottom:1px solid var(--line)} .obs:last-child{border-bottom:none}
  .obs-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px}
  .obs-date{font-size:12px; color:var(--ink-soft); font-weight:600}
  .tag{font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:6px; font-weight:600}
  .tag.general{background:#EFEADD; color:var(--ink-soft)} .tag.examen{background:var(--yellow-bg); color:var(--orange)} .tag.cambio{background:var(--green-bg); color:var(--green)}
  .tag.tri{background:var(--cyan-bg); color:var(--cyan)} .tag.interna{background:var(--red-bg); color:var(--red)}
  .obs-body{font-size:14px}
  .empty{font-size:13px; color:var(--ink-soft); padding:8px 0}

  .seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{background:#fff; color:var(--ink-soft); border:none; padding:8px 14px; font-size:13px; border-radius:0}
  .seg button.active{background:var(--ink); color:#fff}
  .ana-controls{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:8px}
  .ana-overall{font-family:"Bricolage Grotesque"; font-weight:700; font-size:28px; margin:6px 0 0}
  .bajas-line{font-size:13px; color:var(--ink-soft); margin-top:4px}
  .bajas-line b{color:var(--red)}

  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .toolbar input{max-width:230px}
  .switch{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; user-select:none}
  .switch input{width:auto}
  .alist{background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
  .grow{display:grid; grid-template-columns:1fr 56px 1.1fr auto; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line); cursor:pointer}
  .grow:last-child{border-bottom:none} .grow:hover{background:#FBF9F2}
  .grow .an{font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .grow .ag{font-size:13px; color:var(--ink-soft); text-align:center}
  .grow .anv{font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .state{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:20px; justify-self:end; white-space:nowrap}
  .state.on{background:var(--green-bg); color:var(--green)} .state.off{background:var(--red-bg); color:var(--red)}
  .gh{padding:14px 18px; background:var(--ink); color:#fff; display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
  .gh .gn{font-family:"Bricolage Grotesque"; font-weight:700; font-size:16px}
  .gh .gp{font-size:12px; color:#CFC9BC}
  .lrow{display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line)}
  .lrow:last-child{border-bottom:none} .lrow .an{font-weight:600}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .form-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:14px; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; z-index:50}
  .toast.show{opacity:1}
  @media (max-width:620px){ .grid2{grid-template-columns:1fr} .stat-grid{grid-template-columns:1fr} .grow{grid-template-columns:1fr 46px auto} .grow .anv{display:none} }

/* ---------- CARGA ---------- */
async function fetchAllAsis(){
  const all=[]; let from=0; const size=1000;
  while(true){
    const {data}=await db.from("asistencia").select("alumno_id, grupo_id, fecha, presente, nota").order("fecha").range(from, from+size-1);
    if(!data||!data.length) break;
    all.push(...data);
    if(data.length<size) break;
    from+=size;
  }
  return all;
}
async function loadData(){
  const [alumnos,grupos,empresas,asis,temas]=await Promise.all([
    db.from("alumnos").select("id, nombre, email, nivel_sel, grupo_id, empresa_id, activo").order("nombre").then(r=>r.data||[]),
    db.from("grupos").select("id, nombre, profesora, dias, horario, empresa_id").order("nombre").then(r=>r.data||[]),
    db.from("empresas").select("id, nombre").then(r=>r.data||[]),
    fetchAllAsis(),
    db.from("temas").select("grupo_id, tema").then(r=>r.data||[])
  ]);
  Object.assign(ctx,{alumnos,grupos,empresas,asis,temas,
    grupoById:Object.fromEntries(grupos.map(g=>[g.id,g])),
    alumnoById:Object.fromEntries(alumnos.map(a=>[a.id,a]))});
}
async function enterApp(user){
  const {data:staffRow}=await db.from("staff").select("rol").eq("email",user.email.toLowerCase()).maybeSingle();
  ctx={user, email:user.email.toLowerCase(), rol:staffRow?staffRow.rol:"alumno"};
  await loadData();
  renderShell();
}

/* ---------- FICHAS ---------- */
function viewFichas(){
  const {alumnos}=ctx, view=document.getElementById("view");
  if(!alumnos.length){ view.innerHTML='<div class="empty">No hay alumnos para mostrar con tu acceso.</div>'; return; }
  let sel="";
  if(alumnos.length>1) sel=`<div class="selector"><span class="eyebrow">Alumno</span><select id="pick">${alumnos.map(a=>`<option value="${a.id}">${a.nombre}${a.activo?'':' · baja'}</option>`).join("")}</select></div>`;
  view.innerHTML=sel+'<div id="ficha"></div>';
  if(alumnos.length>1) document.getElementById("pick").onchange=e=>renderFicha(e.target.value);
  renderFicha(alumnos[0].id);
}
async function renderFicha(alumnoId){
  const {grupoById,temas,asis,rol}=ctx, al=ctx.alumnoById[alumnoId], cont=document.getElementById("ficha");
  cont.innerHTML='<div class="empty">Cargando ficha…</div>';
  const g=al.grupo_id?grupoById[al.grupo_id]:null;
  const empresa=(ctx.empresas.find(e=>e.id===al.empresa_id)||{}).nombre||"—";
  const rows=asis.filter(a=>a.alumno_id===al.id);
  const total=rows.length, pres=rows.filter(a=>a.presente).length, pct=total?Math.round(pres/total*100):0;
  const buckets=aggPct(rows);
  const bars=buckets.length?barsPct(buckets):'<div class="empty">Sin asistencia cargada.</div>';
  const aus=rows.filter(a=>!a.presente).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  const ausHTML=total===0?'<div class="empty">Sin asistencia cargada.</div>':aus.length===0?'<div class="empty">Asistencia perfecta en el período. 🎉</div>':
    aus.map(a=>`<div class="obs" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="obs-date">${fmtFecha(a.fecha)}</span><span class="tag ${a.nota?'examen':'general'}">${a.nota?a.nota:'sin motivo'}</span></div>`).join("");
  const misTemas=g?temas.filter(t=>t.grupo_id===g.id):[];
  const temasHTML=misTemas.length?`<div class="chips">${misTemas.map(t=>`<span class="chip">${t.tema}</span>`).join("")}</div>`:'<div class="empty">Todavía no hay temas cargados para este grupo.</div>';
  const {data:obs}=await db.from("observaciones").select("fecha, tipo, texto, compartida, trimestre").eq("alumno_id",al.id).order("fecha",{ascending:false});
  const tagCls=t=>t==="examen"?"examen":t==="cambio de grupo"?"cambio":"general";
  const obsHTML=(obs&&obs.length)?obs.map(o=>`<div class="obs"><div class="obs-head"><span class="obs-date">${fmtFecha(o.fecha)}</span>${o.trimestre?`<span class="tag tri">${o.trimestre}</span>`:''}<span class="tag ${tagCls(o.tipo)}">${o.tipo}</span>${(rol==="profesora"&&!o.compartida)?'<span class="tag interna">interna</span>':''}</div><div class="obs-body">${o.texto}</div></div>`).join(""):'<div class="empty">Sin observaciones visibles.</div>';
  const horario=g?[g.dias,g.horario].filter(Boolean).join(" · "):"—";
  cont.innerHTML=`
    <div class="hero"><div class="hero-band"></div><div class="hero-body">
      <div class="hero-top"><div><div class="eyebrow">Ficha de alumno</div><h1 class="name"><span class="hl">${al.nombre}</span></h1></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${al.nivel_sel?`<div class="level-badge">${al.nivel_sel}</div>`:''}${al.activo?'':'<div class="baja-badge">Baja</div>'}</div></div>
      <div class="meta">
        <div><div class="k">Empresa</div><div class="v">${empresa}</div></div>
        <div><div class="k">Grupo</div><div class="v">${g?g.nombre:"—"}</div></div>
        <div><div class="k">Profesora</div><div class="v">${g&&g.profesora?g.profesora:"—"}</div></div>
        <div><div class="k">Horario</div><div class="v">${horario}</div></div>
      </div></div></div>
    <div class="tile"><div class="big">${pct}<small>%</small></div><div class="lab">Asistencia · ${pres} de ${total} clases</div>${bars}</div>
    <div class="section"><h2>Ausencias${aus.length?` <span style="font-family:Inter;font-weight:600;font-size:13px;color:var(--ink-soft)">(${aus.length})</span>`:''}</h2><div class="sub">Días que faltó, con el motivo si quedó registrado.</div>${ausHTML}</div>
    <div class="section"><h2>Temas dictados en el grupo</h2><div class="sub">${g?`Contenidos cubiertos con ${g.nombre}.`:'Sin grupo asignado.'}</div>${temasHTML}</div>
    <div class="section"><h2>Observaciones</h2><div class="sub">${rol==="profesora"?'Trimestrales. Ves todas, incluidas las internas.':'Observaciones compartidas.'}</div>${obsHTML}</div>`;
}

/* ---------- GESTIÓN DE ALUMNOS ---------- */
function viewGestion(){
  const view=document.getElementById("view");
  let q="", hideBajas=false, modo="alumno";
  function render(){
    let inner;
    if(modo==="grupo"){
      inner='';
      ctx.grupos.forEach(g=>{
        const mem=ctx.alumnos.filter(a=>a.grupo_id===g.id && (!hideBajas||a.activo) && matchQ(a));
        if(!mem.length) return;
        inner+=`<div class="alist" style="margin-bottom:14px"><div class="gh"><span class="gn">${g.nombre}</span><span class="gp">${g.profesora||'—'} · ${g.horario||''}</span></div>`+
          mem.map(rowHTML).join("")+`</div>`;
      });
      if(!inner) inner='<div class="empty" style="padding:18px">Nada que mostrar.</div>';
    } else {
      const list=ctx.alumnos.filter(a=>(!hideBajas||a.activo)&&matchQ(a));
      inner=`<div class="alist">${list.map(rowHTML).join("")||'<div class="empty" style="padding:18px">Nada que mostrar.</div>'}</div>`;
    }
    view.innerHTML=`
      <div class="toolbar">
        <input id="q" placeholder="Buscar por nombre o email…" value="${q}">
        <div class="seg" id="modo"><button data-m="alumno" class="${modo==='alumno'?'active':''}">Por alumno</button><button data-m="grupo" class="${modo==='grupo'?'active':''}">Por grupo</button></div>
        <label class="switch"><input type="checkbox" id="hb" ${hideBajas?'checked':''}> Ocultar bajas</label>
        <div style="flex:1"></div>
        <button class="btn-primary btn-sm" id="nuevo">＋ Nuevo alumno</button>
      </div>${inner}`;
    const qi=document.getElementById("q");
    qi.oninput=e=>{ q=e.target.value; const p=e.target.selectionStart; render(); const el=document.getElementById("q"); el.focus(); el.setSelectionRange(p,p); };
    document.getElementById("hb").onchange=e=>{ hideBajas=e.target.checked; render(); };
    document.querySelectorAll("#modo button").forEach(b=>b.onclick=()=>{ modo=b.dataset.m; render(); });
    document.getElementById("nuevo").onclick=()=>form(null);
    view.querySelectorAll(".grow").forEach(r=>r.onclick=()=>form(r.dataset.id));
  }
  function matchQ(a){ return !q || a.nombre.toLowerCase().includes(q.toLowerCase()) || (a.email||"").toLowerCase().includes(q.toLowerCase()); }
  function rowHTML(a){
    const g=a.grupo_id?ctx.grupoById[a.grupo_id]:null;
    return `<div class="grow" data-id="${a.id}"><span class="an">${a.nombre}</span><span class="ag">${g?g.nombre.replace('Avenga ',''):'—'}</span><span class="anv">${a.nivel_sel||'—'}</span><span class="state ${a.activo?'on':'off'}">${a.activo?'activo':'baja'}</span></div>`;
  }
  function form(id){
    const a=id?ctx.alumnoById[id]:{nombre:"",email:"",nivel_sel:"",grupo_id:"",activo:true};
    const gopts=ctx.grupos.map(g=>`<option value="${g.id}" ${g.id===a.grupo_id?'selected':''}>${g.nombre}</option>`).join("");
    const nopts=['<option value="">— sin nivel —</option>'].concat(NIVELES.map(n=>`<option ${n===a.nivel_sel?'selected':''}>${n}</option>`)).join("");
    view.innerHTML=`
      <div class="section" style="max-width:560px">
        <h2>${id?'Editar alumno':'Nuevo alumno'}</h2>
        <div class="sub">${id?'Cambiá lo que necesites. Si cambiás el grupo, se guarda sola una nota de "cambio de grupo".':'Completá los datos del nuevo alumno.'}</div>
        <div class="field"><label class="lab">Nombre</label><input id="f-nombre" value="${(a.nombre||'').replace(/"/g,'&quot;')}"></div>
        <div class="field"><label class="lab">Email</label><input id="f-email" type="email" value="${a.email||''}"></div>
        <div class="grid2">
          <div class="field"><label class="lab">Grupo</label><select id="f-grupo"><option value="">— sin grupo —</option>${gopts}</select></div>
          <div class="field"><label class="lab">Nivel</label><select id="f-nivel">${nopts}</select></div>
        </div>
        <label class="switch" style="margin-top:4px"><input type="checkbox" id="f-activo" ${a.activo?'checked':''}> Alumno activo (destildá para dar de baja)</label>
        <div class="form-actions"><button class="btn-primary" id="save">Guardar</button><button class="btn-ghost" id="cancel">Cancelar</button><div style="flex:1"></div><span class="msg" id="fmsg" style="margin:0"></span></div>
      </div>`;
    document.getElementById("cancel").onclick=render;
    document.getElementById("save").onclick=async()=>{
      const nombre=document.getElementById("f-nombre").value.trim();
      const email=document.getElementById("f-email").value.trim().toLowerCase()||null;
      const grupo_id=document.getElementById("f-grupo").value||null;
      const nivel_sel=document.getElementById("f-nivel").value||null;
      const activo=document.getElementById("f-activo").checked;
      const fmsg=document.getElementById("fmsg");
      if(!nombre){ fmsg.className="msg err"; fmsg.textContent="Poné un nombre."; return; }
      const empresa_id=grupo_id?ctx.grupoById[grupo_id].empresa_id:(a.empresa_id||null);
      const payload={nombre,email,grupo_id,nivel_sel,activo,empresa_id};
      let error;
      if(id){
        const prev=a.grupo_id;
        ({error}=await db.from("alumnos").update(payload).eq("id",id));
        if(!error&&grupo_id&&prev&&grupo_id!==prev){
          const de=(ctx.grupoById[prev].nombre||'').replace('Avenga ',''), aa=(ctx.grupoById[grupo_id].nombre||'').replace('Avenga ','');
          const now=new Date();
          await db.from("observaciones").insert({alumno_id:id,fecha:now.toISOString().slice(0,10),tipo:'cambio de grupo',texto:`Antes en el grupo ${de}. Pasó a ${aa} en ${MESES_L[now.getMonth()]} ${now.getFullYear()}.`,compartida:true});
        }
      } else { ({error}=await db.from("alumnos").insert(payload)); }
      if(error){ fmsg.className="msg err"; fmsg.textContent="No se pudo guardar: "+error.message; return; }
      await loadData(); toast(id?"Alumno actualizado":"Alumno creado"); render();
    };
  }
  render();
}

/* ---------- GESTIONAR ASISTENCIA ---------- */
function viewListaAsis(){
  const {grupos}=ctx, view=document.getElementById("view");
  const hoy=new Date().toISOString().slice(0,10);
  view.innerHTML=`
    <div class="section" style="max-width:680px">
      <h2>Gestionar asistencia</h2>
      <div class="sub">Elegí grupo y fecha, marcá quién vino y guardá. A cada ausente podés ponerle la causa.</div>
      <div class="grid2">
        <div class="field"><label class="lab">Grupo</label><select id="l-grupo"><option value="">— elegí un grupo —</option>${grupos.map(g=>`<option value="${g.id}">${g.nombre}</option>`).join("")}</select></div>
        <div class="field"><label class="lab">Fecha</label><input id="l-fecha" type="date" value="${hoy}"></div>
      </div><div id="l-list"></div>
    </div>`;
  const gsel=document.getElementById("l-grupo"), fsel=document.getElementById("l-fecha"), listEl=document.getElementById("l-list");
  let marks={};
  async function loadList(){
    const gid=gsel.value, fecha=fsel.value;
    if(!gid||!fecha){ listEl.innerHTML=''; return; }
    listEl.innerHTML='<div class="empty">Cargando…</div>';
    const roster=ctx.alumnos.filter(a=>a.grupo_id===gid&&a.activo);
    const {data:ex}=await db.from("asistencia").select("alumno_id, presente, nota").eq("grupo_id",gid).eq("fecha",fecha);
    const exMap=Object.fromEntries((ex||[]).map(r=>[r.alumno_id,r]));
    marks={}; roster.forEach(a=>{const e=exMap[a.id]; marks[a.id]={presente:e?e.presente:true, nota:e?(e.nota||""):""};});
    if(!roster.length){ listEl.innerHTML='<div class="empty">Ese grupo no tiene alumnos activos.</div>'; return; }
    const ya=(ex&&ex.length)?'<div style="font-size:12.5px;color:var(--green);margin-bottom:10px">Ya había lista para esta fecha — la cargué para que la edites.</div>':'';
    listEl.innerHTML=ya+'<div class="alist" style="margin-bottom:16px">'+roster.map(rowHTML).join("")+'</div>'+
      `<div class="form-actions"><button class="btn-primary" id="l-save">Guardar lista</button><span class="msg" id="l-msg" style="margin:0"></span></div>`;
    roster.forEach(a=>bindRow(a.id));
    document.getElementById("l-save").onclick=()=>save(gid,fecha,roster);
  }
  function rowHTML(a){
    const m=marks[a.id];
    const copts=['<option value="">causa…</option>'].concat(CAUSAS.map(c=>`<option ${m.nota===c?'selected':''}>${c}</option>`)).join("");
    return `<div class="lrow"><span class="an">${a.nombre}</span>
      <div class="seg" data-al="${a.id}"><button data-p="1" class="${m.presente?'active':''}">Presente</button><button data-p="0" class="${m.presente?'':'active'}">Ausente</button></div>
      <select class="l-causa" data-al="${a.id}" style="max-width:150px;${m.presente?'visibility:hidden':''}">${copts}</select></div>`;
  }
  function bindRow(id){
    const seg=listEl.querySelector(`.seg[data-al="${id}"]`), causa=listEl.querySelector(`.l-causa[data-al="${id}"]`);
    seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      seg.querySelectorAll("button").forEach(x=>x.classList.remove("active")); b.classList.add("active");
      marks[id].presente=b.dataset.p==="1"; causa.style.visibility=marks[id].presente?'hidden':'visible';
    });
    causa.onchange=e=>{ marks[id].nota=e.target.value; };
  }
  async function save(gid,fecha,roster){
    const msg=document.getElementById("l-msg"); msg.className="msg info"; msg.textContent="Guardando…";
    await db.from("asistencia").delete().eq("grupo_id",gid).eq("fecha",fecha);
    const rows=roster.map(a=>({alumno_id:a.id,grupo_id:gid,fecha,presente:marks[a.id].presente,nota:marks[a.id].presente?null:(marks[a.id].nota||null)}));
    const {error}=await db.from("asistencia").insert(rows);
    if(error){ msg.className="msg err"; msg.textContent="No se pudo guardar: "+error.message; return; }
    await loadData(); msg.className="msg ok"; msg.textContent="Lista guardada ✓"; toast("Lista guardada");
  }
  gsel.onchange=loadList; fsel.onchange=loadList;
}

/* ---------- OBSERVACIONES ---------- */
function viewObs(){
  const {alumnos}=ctx, view=document.getElementById("view");
  const opts=alumnos.map(a=>`<option value="${a.id}">${a.nombre}${a.activo?'':' · baja'}</option>`).join("");
  view.innerHTML=`<div class="selector"><span class="eyebrow">Alumno</span><select id="o-al">${opts}</select></div><div id="o-body"></div>`;
  const alSel=document.getElementById("o-al"); alSel.onchange=()=>load(alSel.value); load(alSel.value);
  function obsItem(o){
    return `<div class="obs"><div class="obs-head"><span class="obs-date">${fmtFecha(o.fecha)}</span>${o.trimestre?`<span class="tag tri">${o.trimestre}</span>`:''}<span class="tag ${o.tipo==='examen'?'examen':o.tipo==='cambio de grupo'?'cambio':'general'}">${o.tipo}</span><span class="tag ${o.compartida?'cambio':'interna'}">${o.compartida?'compartida':'interna'}</span><div style="flex:1"></div><button class="btn-ghost btn-sm" data-del="${o.id}">Borrar</button></div><div class="obs-body">${o.texto}</div></div>`;
  }
  async function load(alId){
    const body=document.getElementById("o-body"); body.innerHTML='<div class="empty">Cargando…</div>';
    const {data:obs}=await db.from("observaciones").select("id, fecha, tipo, texto, compartida, trimestre").eq("alumno_id",alId).order("fecha",{ascending:false});
    const y=new Date().getFullYear(); const tri=['','1er trimestre '+y,'2do trimestre '+y,'3er trimestre '+y,'4to trimestre '+y];
    body.innerHTML=`
      <div class="section" style="max-width:640px">
        <h2>Nueva observación</h2>
        <div class="grid2">
          <div class="field"><label class="lab">Tipo</label><select id="o-tipo"><option>general</option><option>examen</option><option>cambio de grupo</option></select></div>
          <div class="field"><label class="lab">Trimestre</label><select id="o-tri">${tri.map(t=>`<option value="${t}">${t||'— sin trimestre —'}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label class="lab">Texto</label><textarea id="o-texto" placeholder="Escribí la observación…"></textarea></div>
        <label class="switch"><input type="checkbox" id="o-comp"> Compartida — la ven el alumno y RRHH. Sin tildar queda interna (solo profesoras).</label>
        <div class="form-actions"><button class="btn-primary" id="o-save">Guardar observación</button><span class="msg" id="o-msg" style="margin:0"></span></div>
      </div>
      <div class="section"><h2>Observaciones cargadas</h2>${(obs&&obs.length)?obs.map(obsItem).join(''):'<div class="empty">Todavía no hay observaciones para este alumno.</div>'}</div>`;
    document.getElementById("o-save").onclick=async()=>{
      const texto=document.getElementById("o-texto").value.trim(), msg=document.getElementById("o-msg");
      if(!texto){ msg.className="msg err"; msg.textContent="Escribí algo antes de guardar."; return; }
      const payload={alumno_id:alId,tipo:document.getElementById("o-tipo").value,trimestre:document.getElementById("o-tri").value||null,texto,compartida:document.getElementById("o-comp").checked,fecha:new Date().toISOString().slice(0,10)};
      const {error}=await db.from("observaciones").insert(payload);
      if(error){ msg.className="msg err"; msg.textContent="No se pudo guardar: "+error.message; return; }
      toast("Observación guardada"); load(alId);
    };
    body.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("¿Borrar esta observación?"))return; await db.from("observaciones").delete().eq("id",b.dataset.del); toast("Observación borrada"); load(alId); });
  }
}

/* ---------- REPORTES ---------- */
function viewReportes(){
  const {alumnos,grupos,empresas}=ctx, view=document.getElementById("view");
  view.innerHTML=`
    <div class="section">
      <h2>Reportes</h2>
      <div class="sub">Asistencia e inasistencias por alumno, grupo o empresa.</div>
      <div class="ana-controls">
        <div class="seg" id="mode"><button data-m="asis" class="active">Asistencia</button><button data-m="causa">Inasistencias por causa</button></div>
      </div>
      <div class="ana-controls">
        <div class="seg" id="scope"><button data-s="alumno" class="active">Alumno</button><button data-s="grupo">Grupo</button><button data-s="empresa">Empresa</button></div>
        <select id="target" style="max-width:280px"></select>
        <select id="causa" style="max-width:170px;display:none"></select>
      </div>
      <div class="ana-overall" id="overall"></div>
      <div class="bajas-line" id="bajas"></div>
      <div id="chart"></div>
      <div id="extra"></div>
    </div>`;
  let mode="asis", scope="alumno";
  const targetSel=document.getElementById("target"), causaSel=document.getElementById("causa");
  causaSel.innerHTML=['<option value="">Todas las causas</option>'].concat(CAUSAS.concat(["Sin motivo"]).map(c=>`<option>${c}</option>`)).join("");
  function fillTargets(){
    let opts= scope==="alumno"?alumnos.map(a=>[a.id,a.nombre]) : scope==="grupo"?grupos.map(g=>[g.id,g.nombre]) : empresas.map(e=>[e.id,e.nombre]);
    targetSel.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("");
  }
  function membersOf(scope,id){
    if(scope==="grupo") return ctx.alumnos.filter(a=>a.grupo_id===id);
    if(scope==="empresa") return ctx.alumnos.filter(a=>a.empresa_id===id);
    return [];
  }
  function redraw(){
    const id=targetSel.value;
    const rows=filterAsis(scope,id);
    causaSel.style.display = mode==="causa" ? "" : "none";
    // bajas %
    const bl=document.getElementById("bajas");
    if(scope!=="alumno"){ const mem=membersOf(scope,id); const b=mem.filter(a=>!a.activo).length;
      bl.innerHTML=mem.length?`Bajas: <b>${b} de ${mem.length} (${Math.round(b/mem.length*100)}%)</b>`:''; }
    else bl.innerHTML='';

    if(mode==="asis"){
      const total=rows.length, pres=rows.filter(a=>a.presente).length, pct=total?Math.round(pres/total*100):0;
      document.getElementById("overall").innerHTML=total?`${pct}% <span style="font-size:13px;color:var(--ink-soft);font-weight:400">promedio anual · ${pres} de ${total} asistencias</span>`:'<span style="font-size:14px;color:var(--ink-soft);font-weight:400">Sin datos para esta selección.</span>';
      const buckets=aggPct(rows);
      document.getElementById("chart").innerHTML=buckets.length?barsPct(buckets):'';
      let extra='';
      if(scope==="grupo"){
        const mem=ctx.alumnos.filter(a=>a.grupo_id===id).sort((a,b)=>a.nombre.localeCompare(b.nombre));
        extra=`<div style="margin-top:24px"><div class="eyebrow" style="margin-bottom:10px">Asistencia por alumno del grupo (${mem.length})</div>`+
          (mem.length?'<div class="alist">'+mem.map(a=>{const rr=ctx.asis.filter(x=>x.alumno_id===a.id);const t=rr.length,p=rr.filter(x=>x.presente).length,pc=t?Math.round(p/t*100):0;return `<div class="lrow"><span class="an">${a.nombre}${a.activo?'':' · baja'}</span><span class="anv" style="font-size:12px;color:var(--ink-soft)">${p}/${t} clases</span><span class="state ${pc>=85?'on':'off'}">${t?pc+'%':'sin datos'}</span></div>`;}).join('')+'</div>':'<div class="empty">Este grupo no tiene alumnos.</div>')+'</div>';
      }
      document.getElementById("extra").innerHTML=extra;
    } else {
      let abs=rows.filter(a=>!a.presente);
      const causa=causaSel.value;
      if(causa) abs=abs.filter(a=>causaDe(a.nota)===causa);
      document.getElementById("overall").innerHTML=`${abs.length} <span style="font-size:13px;color:var(--ink-soft);font-weight:400">inasistencias${causa?` por ${causa.toLowerCase()}`:''}</span>`;
      const buckets=aggCount(abs);
      document.getElementById("chart").innerHTML=buckets.length?barsCount(buckets):'<div class="empty">Sin inasistencias para esta selección.</div>';
      // breakdown by cause
      const by={}; rows.filter(a=>!a.presente).forEach(a=>{const c=causaDe(a.nota); by[c]=(by[c]||0)+1;});
      const items=Object.entries(by).sort((a,b)=>b[1]-a[1]);
      document.getElementById("extra").innerHTML= items.length?`<div style="margin-top:22px"><div class="eyebrow" style="margin-bottom:10px">Inasistencias por causa</div><div class="chips">${items.map(([c,n])=>`<span class="cause-chip">${c}: ${n}</span>`).join('')}</div></div>`:'';
    }
  }
  document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#mode button").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.m;redraw();});
  document.querySelectorAll("#scope button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#scope button").forEach(x=>x.classList.remove("active"));b.classList.add("active");scope=b.dataset.s;fillTargets();redraw();});
  targetSel.onchange=redraw; causaSel.onchange=redraw;
  fillTargets(); redraw();
}
function filterAsis(scope,targetId){
  const {asis,alumnoById,grupoById}=ctx;
  return asis.filter(a=>{
    const al=alumnoById[a.alumno_id];
    const grupoId=a.grupo_id||(al?al.grupo_id:null);
    const empresaId=(grupoId&&grupoById[grupoId]?grupoById[grupoId].empresa_id:null)||(al?al.empresa_id:null);
    if(scope==="alumno") return a.alumno_id===targetId;
    if(scope==="grupo") return grupoId===targetId;
    return empresaId===targetId;
  });
}
function aggPct(rows){
  const map={}; rows.forEach(a=>{const k=a.fecha.slice(0,7); map[k]=map[k]||{p:0,t:0}; map[k].t++; if(a.presente)map[k].p++;});
  let keys=Object.keys(map).sort(); if(keys.length>12)keys=keys.slice(-12);
  return keys.map(k=>{const m=map[k],pct=Math.round(m.p/m.t*100);return {lab:MESES[parseInt(k.slice(5,7))-1]+" "+k.slice(2,4),pct,p:m.p,t:m.t};});
}
function aggCount(rows){
  const map={}; rows.forEach(a=>{const k=a.fecha.slice(0,7); map[k]=(map[k]||0)+1;});
  let keys=Object.keys(map).sort(); if(keys.length>12)keys=keys.slice(-12);
  return keys.map(k=>({lab:MESES[parseInt(k.slice(5,7))-1]+" "+k.slice(2,4),n:map[k]}));
}
function barsPct(buckets){
  return `<div class="bars">${buckets.map(b=>`<div class="bar-col" title="${b.p} de ${b.t}"><div class="bar-val">${b.pct}%</div><div class="bar-fill ${b.pct<85?'low':''}" style="height:${Math.max(b.pct,3)}%"></div><div class="bar-lab">${b.lab}</div></div>`).join("")}</div>`;
}
function barsCount(buckets){
  const max=Math.max(1,...buckets.map(b=>b.n));
  return `<div class="bars">${buckets.map(b=>`<div class="bar-col" title="${b.n} inasistencias"><div class="bar-val">${b.n}</div><div class="bar-fill abs" style="height:${Math.max(b.n/max*100,3)}%"></div><div class="bar-lab">${b.lab}</div></div>`).join("")}</div>`;
}
</script>
</body>
